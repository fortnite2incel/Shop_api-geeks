

services:

  db:

    image: postgres:16-alpine

    restart: unless-stopped

    environment:

      POSTGRES_DB: ${DB_NAME}

      POSTGRES_USER: ${DB_USER}

      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:

      - postgres_data:/var/lib/postgresql/data

    ports:

      - "5432:5432"

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]

      interval: 5s

      timeout: 5s

      retries: 5

  redis:

    image: redis:7-alpine

    restart: unless-stopped

    ports:

      - "6379:6379"

    healthcheck:

      test: ["CMD", "redis-cli", "ping"]

      interval: 5s

      timeout: 5s

      retries: 5

  web:

    build: .

    restart: unless-stopped

    command: sh /app/entrypoint.sh

    volumes:

      - .:/app

      - static_data:/app/static

      - media_data:/app/media

    expose:

      - 8000

    env_file:

      - .env

    environment:

      - PYTHONUNBUFFERED=1

    depends_on:

      db:

        condition: service_healthy

      redis:

        condition: service_healthy

  celery_worker:

    build: .

    restart: unless-stopped

    command: celery -A shop_api worker -l info

    volumes:

      - .:/app

    env_file:

      - .env

    environment:

      - PYTHONUNBUFFERED=1

    depends_on:

      db:

        condition: service_healthy

      redis:

        condition: service_healthy

  celery_beat:

    build: .

    restart: unless-stopped

    command: celery -A shop_api beat -l info

    volumes:

      - .:/app

    env_file:

      - .env

    environment:

      - PYTHONUNBUFFERED=1

    depends_on:

      db:

        condition: service_healthy

      redis:

        condition: service_healthy

  nginx:

    image: nginx:1

    restart: unless-stopped

    ports:

      - "80:80"

    volumes:

      - ./nginx.conf:/etc/nginx/conf.d/default.conf

      - static_data:/app/static

      - media_data:/app/media

    depends_on:

      - web

volumes:

  postgres_data:

  static_data:

  media_data:

